[project]
name = "pfcookiecutter"
version = "0.1.3"
description = "Add parser for update cookiecutter template for correct pycharm lexer works"
authors = [
    {name = "Stroev George", email = "stroev20160@gmail.com"},
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cookiecutter>=2.7.1",
    "pydantic>=2.12.5",
    "sqlalchemy>=2.0.48",
    "typer>=0.24.1",
]

[project.scripts]
pfc = "pfcookiecutter.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
